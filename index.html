<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carlos Peixoto - Desenvolvedor Frontend</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- ScrollReveal -->
  <script src="https://unpkg.com/scrollreveal"></script>
</head>
<body>

<header>
  <nav>
    <h1>Carlos Peixoto (Em construção) </h1>

    <div class="nav-right">
      <ul>
        <li><a href="#about">Sobre</a></li>
        <li><a href="#projects">Projetos</a></li>
        <li><a href="#contact">Contato</a></li>
      </ul>

      <button id="themeToggle">🌙</button>
    </div>
  </nav>
</header>

<section class="hero">
  <h2>Olá, eu sou <span>Carlos Peixoto</span></h2>
  <p>Frontend Developer | UI Designer</p>
  <button onclick="scrollToSection('contact')">Fale comigo</button>
</section>

<section id="about" class="section glass">
  <h2>Sobre mim</h2>
  <p>Crio interfaces modernas, rápidas e bonitas com foco em experiência do usuário.</p>
</section>

<section id="projects" class="section">
  <h2>Projetos</h2>

  <div class="cards">
    <div class="card neon">Projeto 1</div>
    <div class="card neon">Projeto 2</div>
    <div class="card neon">Projeto 3</div>
  </div>
</section>

<section id="contact" class="section glass">
  <h2>Contato</h2>

  <form id="contactForm">
    <input type="text" placeholder="Nome" required>
    <input type="email" placeholder="Email" required>
    <textarea placeholder="Mensagem" required></textarea>
    <button type="submit">Enviar</button>
  </form>

  <p id="status"></p>
</section>

<footer>
  <p>© 2026 Carlos Peixoto</p>
</footer>

<script src="script.js"></script>
</body>
</html>
